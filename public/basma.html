 b.supply=+(b.supply-qty).toFixed(6);claims.add(claimId);offset+=qty;const blk=await mkBlock("RETIRE",{batch:b.id,serial:b.serial,qty,buyer,claimId,remaining:b.supply});return{ok:true,blk,b,qty,buyer,claimId}}
// ---------- Render ----------
function ring(a){const c=2*Math.PI*26,col=GC[a.grade];return`<svg width="70" height="70" viewBox="0 0 64 64" aria-label="score ${a.score}"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--bd)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${c*a.score/100} ${c}" transform="rotate(-90 32 32)" stroke-linecap="round"/><text x="32" y="31" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${a.score}</text><text x="32" y="45" text-anchor="middle" font-size="10" fill="${col}" font-weight="700">${a.grade}</text></svg>`}
function render(){document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("lang").textContent=t("lang");
 $("k1").textContent=offset.toFixed(3);$("k2").textContent=B.length;$("k3").textContent=blocked;$("k4").textContent=chain.length;
 const sel=$("selB").value;$("selB").innerHTML=B.map(b=>`<option value="${b.id}">${b.id} · ${esc(b.name)} · ${b.a.score}/${b.a.grade} · ${b.supply.toLocaleString()} t</option>`).join("");if(sel)$("selB").value=sel;
 $("cards").innerHTML=B.map(b=>`<article class="card"><div class="bt">${ring(b.a)}<div><h3>${b.id} · ${esc(b.name)}</h3><div class="meta">${b.type} · ${esc(b.loc)} · vintage ${b.vintage}<br>${b.supply.toLocaleString()} t ${t("avail")} · $${b.price}/t · ${b.area?b.area+" ha":b.mw+" MW"} · claimed ${b.claimed.toLocaleString()} t/yr<br>verifier: ${esc(b.verifier||"none")} (${b.verifiedYear}) · serial ${b.serial}<br>seller: ${esc(b.seller)} (${b.sellerAge} yr)</div></div></div>
 <details><summary>${t("why")}</summary>${b.a.fl.length?b.a.fl.map(f=>`<div class="fl" style="color:${f.c?"var(--bad)":"inherit"}">• ${FT[L][f.k](f.v)} <b>${Math.round(f.d)}</b><div class="bar" style="inline-size:${Math.min(100,Math.abs(f.d)/40*100)}%;background:${f.c?"var(--bad)":"var(--warn)"}"></div></div>`).join(""):`<div class="fl" style="color:var(--ok)">✓ ${t("noFlags")}</div>`}<div class="meta">yield ${b.a.yield} t/${b.area?"ha":"MW"}/yr · z = ${b.a.z}</div></details></article>`).join("");
 $("chain").innerHTML=[...chain].reverse().map(c=>`<div class="card blk" id="blk${c.index}"><b>#${c.index} ${c.type}</b> · ${c.timestamp}<br>hash: <span class="h" data-copy="${c.hash}" tabindex="0">${c.hash.slice(0,18)}…</span> · prev: <span class="h" data-copy="${c.prevHash}" tabindex="0">${c.prevHash.slice(0,18)}…</span><br><span class="meta">${esc(JSON.stringify(c.payload))}</span></div>`).join("");
 if(FP)renderFP()}
function tab(id){["fp","mk","lg"].forEach(x=>$(x).hidden=x!==id);document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===id))}
async function doRetire(attack){const args=attack&&lastRetire?lastRetire:{id:$("selB").value,qty:+$("qty").value,buyer:$("buyer").value.trim()||"Demo User"};
 const claimId=await sha(args.buyer+($("txt").value)+args.qty);const r=await retire(args.id,args.qty,args.buyer,claimId);
 if(!r.ok){$("offOut").innerHTML=`<div class="banner err">${t("rev")}: ${esc(r.reason)}</div>`+(attack?$("certBox")?.outerHTML||"":"")}
 else{lastRetire=args;$("offOut").innerHTML=`<div class="card cert" id="certBox"><h3>🏅 ${t("cert")}</h3><div>${t("buyer")}: <b>${esc(r.buyer)}</b><br>${r.qty} tCO2e · ${r.b.id} ${esc(r.b.name)}<br>serial ${r.b.serial}<br>block #${r.blk.index}: <code>${r.blk.hash.slice(0,32)}…</code><br>${r.blk.timestamp}</div><div class="row"><button class="r" data-act="attack">${t("attack")}</button></div></div>`}
 render()}
async function verify(){document.querySelectorAll(".blk").forEach(e=>e.classList.remove("broken"));for(let i=0;i<chain.length;i++){const c=chain[i];const ok=(await hashBlock(c))===c.hash&&(i===0||c.prevHash===chain[i-1].hash);
 if(!ok){$("vOut").innerHTML=`<div class="banner err">✗ ${t("badV")} #${i}</div>`;$("blk"+i)?.classList.add("broken");return}}$("vOut").innerHTML=`<div class="banner okb">✓ ${t("okV")} (${chain.length})</div>`}
document.addEventListener("click",async e=>{const el=e.target.closest("button,[data-copy]");if(!el)return;
 if(el.dataset.tab)return tab(el.dataset.tab);if(el.dataset.copy){navigator.clipboard?.writeText(el.dataset.copy).catch(()=>{});el.textContent="copied ✓";return}
 switch(el.id){case"lang":L=L==="en"?"ar":"en";document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";render();break;
 case"analyze":FP=parse($("txt").value);renderFP();break;
 case"toOffset":$("qty").value=+(FP.total/1000).toFixed(5);tab("mk");break;
 case"retire":doRetire(false);break;
 case"verify":verify();break;
 case"tamper":{const c=chain.find(x=>x.type==="LIST");c.payload.supply*=10;render();$("vOut").innerHTML=`<div class="banner err">${t("tampered")}</div>`;tab("lg");break}
 case"reset":FP=null;await init();break;
 case"dl":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(chain,null,2)],{type:"application/json"}));a.download="basmachain.json";a.click();break}}
 if(el.dataset.act==="attack")doRetire(true)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset?.copy)e.target.click()});
init().then(()=>tab("fp"));
</script>
</body>
</html>
